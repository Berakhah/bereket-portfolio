<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og-card</title>
<style>@font-face {
  font-family: 'Newsreader';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('../../site/assets/fonts/newsreader-italic-400.woff2') format('woff2');
}
@font-face {
  font-family: 'Geist';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url('../../site/assets/fonts/geist-normal-300-700.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('../../site/assets/fonts/plex-mono-normal-400.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('../../site/assets/fonts/plex-mono-normal-500.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('../../site/assets/fonts/plex-mono-normal-600.woff2') format('woff2');
}
@font-face {
  font-family: 'Newsreader';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('../../site/assets/fonts/newsreader-normal-500.woff2') format('woff2');
}

  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f4f1ea; color: #16130f; font-family: Geist, system-ui, sans-serif; position: relative; overflow: hidden; }
  .in { position: absolute; inset: 72px 80px; display: grid; grid-template-columns: 1fr 340px; gap: 64px; align-items: center; }
  .eyebrow { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: #6b655c; margin: 0 0 24px; }
  h1 { font-family: Newsreader, serif; font-weight: 500; font-size: 84px; line-height: .95; letter-spacing: -.025em; margin: 0; }
  h1 em { font-style: italic; font-weight: 400; color: #ff4d1c; }
  .name { margin-top: 36px; font-size: 26px; }
  .name span { color: #6b655c; }
  .pic { width: 340px; height: 453px; object-fit: cover; object-position: 50% 15%; border-radius: 999px 999px 24px 24px; }
</style></head>
<body>
<div class="in">
  <div>
    <p class="eyebrow">Backend Security Engineer · Addis Ababa</p>
    <h1>Systems that stay <em>trustworthy</em> when everything else changes.</h1>
    <p class="name">Bereket Tilahun <span>· berakhah.github.io</span></p>
  </div>
  <img class="pic" src="../../site/assets/img/bereket-600.jpg" alt="">
</div>
</body></html>
